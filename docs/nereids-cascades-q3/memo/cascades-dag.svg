<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1830 1600" width="1830" height="1600" role="img" aria-labelledby="title desc">
  <title id="title">Nereids Cascades Memo Group DAG</title>
  <desc id="desc">All 20 groups from the Cascades memo for the three-table teaching query, including logical expressions, physical expressions, enforcers, chosen expressions, and child group relationships. Statistics and costs are omitted.</desc>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#64748b"/>
    </marker>
    <style>
      .background { fill: #f8fafc; }
      .edge { fill: none; stroke: #64748b; stroke-width: 2.2; marker-end: url(#arrow); }
      .node { fill: #ffffff; stroke: #334155; stroke-width: 2; rx: 10; }
      .root { fill: #fefce8; stroke: #a16207; stroke-width: 3; }
      .alternative { fill: #faf5ff; stroke: #7e22ce; }
      .title { font: 700 17px ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; fill: #0f172a; }
      .line { font: 13px ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; fill: #334155; }
      .logical { fill: #1d4ed8; }
      .physical { fill: #047857; }
      .enforcer { fill: #c2410c; }
      .heading { font: 700 24px system-ui, sans-serif; fill: #0f172a; }
      .subtitle { font: 14px system-ui, sans-serif; fill: #475569; }
    </style>
  </defs>

  <rect class="background" x="0" y="0" width="1830" height="1600"/>
  <text x="60" y="38" class="heading">Nereids Cascades Memo — complete Group DAG</text>
  <text x="60" y="62" class="subtitle">Arrows point from an expression's Group to its child Group. Costs, row estimates, statistics, and properties are omitted.</text>

  <!-- Cross-group child dependencies. Self-referencing enforcers stay inside their Group node. -->
  <path class="edge" d="M900 155 L900 175"/>
  <path class="edge" d="M820 300 L820 340"/>
  <path class="edge" d="M1120 245 C1180 245 1180 245 1230 245"/>
  <path class="edge" d="M1230 285 C1190 315 1160 350 1150 380"/>
  <path class="edge" d="M760 495 C700 520 650 540 590 555"/>
  <path class="edge" d="M1040 495 C1110 520 1160 535 1220 555"/>
  <path class="edge" d="M430 700 L430 730"/>
  <path class="edge" d="M330 700 C260 840 220 1000 260 1125"/>
  <path class="edge" d="M1140 700 C1080 715 1040 730 1010 745"/>
  <path class="edge" d="M1390 700 C1450 715 1500 730 1540 745"/>
  <path class="edge" d="M430 845 L430 890"/>
  <path class="edge" d="M1020 865 L1020 890"/>
  <path class="edge" d="M1545 845 L1545 1125"/>
  <path class="edge" d="M520 1070 C600 1090 700 1100 790 1125"/>
  <path class="edge" d="M700 1050 C950 1070 1250 1090 1430 1125"/>
  <path class="edge" d="M930 1070 C800 1090 650 1100 520 1130"/>
  <path class="edge" d="M1120 1070 C1080 1085 1040 1100 1010 1125"/>
  <path class="edge" d="M300 1260 L300 1320"/>
  <path class="edge" d="M900 1280 L900 1320"/>
  <path class="edge" d="M1510 1265 L1510 1320"/>
  <path class="edge" d="M300 1420 L300 1470"/>
  <path class="edge" d="M900 1420 L900 1470"/>
  <path class="edge" d="M1510 1420 L1510 1470"/>

  <!-- ROOT @14 -->
  <rect class="node root" x="650" y="75" width="500" height="80"/>
  <text x="670" y="102" class="title">ROOT @14 · ResultSink</text>
  <text x="670" y="126" class="line logical">L1  88  LogicalResultSink(@13)</text>
  <text x="670" y="148" class="line physical">P1* 90  PhysicalResultSink(@13)</text>

  <!-- @13 -->
  <rect class="node" x="650" y="175" width="500" height="125"/>
  <text x="670" y="202" class="title">@13 · ORDER BY</text>
  <text x="670" y="226" class="line logical">L1  87  LogicalSort(@12)</text>
  <text x="670" y="248" class="line physical">P1* 95  MergeSort(@15)</text>
  <text x="670" y="270" class="line physical">P2  96  GatherSort(@12)</text>
  <text x="670" y="290" class="line enforcer">E   none</text>

  <!-- @15 -->
  <rect class="node" x="1230" y="195" width="500" height="105"/>
  <text x="1250" y="222" class="title">@15 · local sort implementation</text>
  <text x="1250" y="246" class="line logical">L   none</text>
  <text x="1250" y="268" class="line physical">P1* 94  LocalSort(@12)</text>
  <text x="1250" y="290" class="line enforcer">E1* 198 Gather(@15 self)</text>

  <!-- @12 -->
  <rect class="node alternative" x="650" y="340" width="500" height="155"/>
  <text x="670" y="367" class="title">@12 · final projection · join orders meet</text>
  <text x="670" y="391" class="line logical">L1  86  Project(@11)  = (c join o) join l</text>
  <text x="670" y="413" class="line logical">L2 163  Project(@19)  = c join (o join l)</text>
  <text x="670" y="435" class="line physical">P1* 98  PhysicalProject(@11)</text>
  <text x="670" y="457" class="line physical">P2 165  PhysicalProject(@19)</text>
  <text x="670" y="479" class="line enforcer">E1 156  Gather(@12 self)</text>

  <!-- @11 -->
  <rect class="node alternative" x="280" y="555" width="470" height="145"/>
  <text x="300" y="582" class="title">@11 · (c join o) join l</text>
  <text x="300" y="606" class="line logical">L1  85  Join(@2,@10)</text>
  <text x="300" y="628" class="line logical">L2 148  Join(@10,@2)</text>
  <text x="300" y="650" class="line physical">P1*100  HashJoin(@2,@10)</text>
  <text x="300" y="672" class="line physical">P2 150  HashJoin(@10,@2)</text>
  <text x="300" y="692" class="line enforcer">E   none</text>

  <!-- @19 -->
  <rect class="node alternative" x="1050" y="555" width="470" height="145"/>
  <text x="1070" y="582" class="title">@19 · c join (o join l)</text>
  <text x="1070" y="606" class="line logical">L1 162  Join(@17,@18)</text>
  <text x="1070" y="628" class="line logical">L2 192  Join(@18,@17)</text>
  <text x="1070" y="650" class="line physical">P1 167  HashJoin(@17,@18)</text>
  <text x="1070" y="672" class="line physical">P2 194  HashJoin(@18,@17)</text>
  <text x="1070" y="692" class="line enforcer">E   none</text>

  <!-- @10 -->
  <rect class="node" x="280" y="730" width="470" height="115"/>
  <text x="300" y="757" class="title">@10 · project c join o</text>
  <text x="300" y="781" class="line logical">L1  84  Project(@9)</text>
  <text x="300" y="803" class="line physical">P1*108  PhysicalProject(@9)</text>
  <text x="300" y="825" class="line enforcer">E 144* hash | 146 replicated (@10 self)</text>

  <!-- @17 -->
  <rect class="node" x="850" y="730" width="430" height="135"/>
  <text x="870" y="757" class="title">@17 · project o join l</text>
  <text x="870" y="781" class="line logical">L1 160 Project(@16)</text>
  <text x="870" y="803" class="line physical">P1 169 PhysicalProject(@16)</text>
  <text x="870" y="825" class="line enforcer">E 179 hash | 188 bucket</text>
  <text x="870" y="847" class="line enforcer">  196 replicated (@17 self)</text>

  <!-- @18 -->
  <rect class="node" x="1350" y="730" width="400" height="115"/>
  <text x="1370" y="757" class="title">@18 · customer projection</text>
  <text x="1370" y="781" class="line logical">L1 161 Project(@8)</text>
  <text x="1370" y="803" class="line physical">P1 183 PhysicalProject(@8)</text>
  <text x="1370" y="825" class="line enforcer">E 186 hash | 190 replicated (self)</text>

  <!-- @9 -->
  <rect class="node" x="280" y="890" width="470" height="180"/>
  <text x="300" y="917" class="title">@9 · c join o</text>
  <text x="300" y="941" class="line logical">L1  83  Join(@5,@8)</text>
  <text x="300" y="963" class="line logical">L2 136  Join(@8,@5)</text>
  <text x="300" y="985" class="line physical">P1*110  HashJoin(@5,@8)</text>
  <text x="300" y="1007" class="line physical">P2 138  HashJoin(@8,@5)</text>
  <text x="300" y="1029" class="line enforcer">E1 142  hash distribute (@9 self)</text>
  <text x="300" y="1051" class="line">condition: c_custkey = o_custkey</text>

  <!-- @16 -->
  <rect class="node" x="900" y="890" width="470" height="180"/>
  <text x="920" y="917" class="title">@16 · o join l</text>
  <text x="920" y="941" class="line logical">L1 159  Join(@2,@5)</text>
  <text x="920" y="963" class="line logical">L2 175  Join(@5,@2)</text>
  <text x="920" y="985" class="line physical">P1 171  HashJoin(@2,@5)</text>
  <text x="920" y="1007" class="line physical">P2 177  HashJoin(@5,@2)</text>
  <text x="920" y="1029" class="line enforcer">E1 181  hash distribute (@16 self)</text>
  <text x="920" y="1051" class="line">condition: o_orderkey = l_orderkey</text>

  <!-- @2 -->
  <rect class="node" x="80" y="1125" width="480" height="135"/>
  <text x="100" y="1152" class="title">@2 · lineitem projection</text>
  <text x="100" y="1176" class="line logical">L1  76  Project(@1)</text>
  <text x="100" y="1198" class="line physical">P1*102 PhysicalProject(@1)</text>
  <text x="100" y="1220" class="line enforcer">E 152 bucket | 154 replicated (@2 self)</text>
  <text x="100" y="1242" class="line">output: l_orderkey, l_linenumber</text>

  <!-- @5 -->
  <rect class="node" x="660" y="1125" width="500" height="155"/>
  <text x="680" y="1152" class="title">@5 · orders projection</text>
  <text x="680" y="1176" class="line logical">L1  79  Project(@4)</text>
  <text x="680" y="1198" class="line physical">P1*112 PhysicalProject(@4)</text>
  <text x="680" y="1220" class="line enforcer">E 118 hash | 132 bucket | 140 replicated</text>
  <text x="680" y="1242" class="line enforcer">  173 bucket by orderkey (@5 self)</text>
  <text x="680" y="1264" class="line">output: o_orderkey, o_custkey, o_orderdate</text>

  <!-- @8 -->
  <rect class="node" x="1270" y="1125" width="480" height="140"/>
  <text x="1290" y="1152" class="title">@8 · customer projection</text>
  <text x="1290" y="1176" class="line logical">L1  82  Project(@7)</text>
  <text x="1290" y="1198" class="line physical">P1*124 PhysicalProject(@7)</text>
  <text x="1290" y="1220" class="line enforcer">E 130 hash | 134* replicated (@8 self)</text>
  <text x="1290" y="1242" class="line">output: c_custkey</text>

  <!-- Filters -->
  <rect class="node" x="80" y="1320" width="480" height="100"/>
  <text x="100" y="1347" class="title">@1 · lineitem filter</text>
  <text x="100" y="1371" class="line logical">L1 75 Filter(shipdate &gt; 1995-03-15, @0)</text>
  <text x="100" y="1393" class="line physical">P1*104 PhysicalFilter(@0) · E none</text>

  <rect class="node" x="660" y="1320" width="500" height="100"/>
  <text x="680" y="1347" class="title">@4 · orders filter</text>
  <text x="680" y="1371" class="line logical">L1 78 Filter(orderdate &lt; 1995-03-15, @3)</text>
  <text x="680" y="1393" class="line physical">P1*114 PhysicalFilter(@3) · E 120 hash(self)</text>

  <rect class="node" x="1270" y="1320" width="480" height="100"/>
  <text x="1290" y="1347" class="title">@7 · customer filter</text>
  <text x="1290" y="1371" class="line logical">L1 81 Filter(mktsegment='BUILDING', @6)</text>
  <text x="1290" y="1393" class="line physical">P1*126 PhysicalFilter(@6) · E none</text>

  <!-- Scans -->
  <rect class="node" x="80" y="1470" width="480" height="90"/>
  <text x="100" y="1497" class="title">@0 · lineitem</text>
  <text x="100" y="1521" class="line logical">L1 74 LogicalOlapScan</text>
  <text x="100" y="1543" class="line physical">P1*106 PhysicalOlapScan · E none</text>

  <rect class="node" x="660" y="1470" width="500" height="90"/>
  <text x="680" y="1497" class="title">@3 · orders</text>
  <text x="680" y="1521" class="line logical">L1 77 LogicalOlapScan</text>
  <text x="680" y="1543" class="line physical">P1*116 PhysicalOlapScan · E 122 hash(self)</text>

  <rect class="node" x="1270" y="1470" width="480" height="90"/>
  <text x="1290" y="1497" class="title">@6 · customer</text>
  <text x="1290" y="1521" class="line logical">L1 80 LogicalOlapScan</text>
  <text x="1290" y="1543" class="line physical">P1*128 PhysicalOlapScan · E none</text>

  <!-- Legend -->
  <text x="80" y="1585" class="line logical">L = LogicalExpression</text>
  <text x="350" y="1585" class="line physical">P = PhysicalExpression</text>
  <text x="650" y="1585" class="line enforcer">E = Enforcer</text>
  <text x="850" y="1585" class="line">* = chosen; self = Enforcer references its own Group</text>
</svg>
