<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1800 1540" width="1800" height="1540" role="img" aria-labelledby="title desc">
  <title id="title">Nereids Cascades Initial Memo after toMemo</title>
  <desc id="desc">The 15 logical Groups created children-first from the rewritten three-table query when CascadesContext.toMemo returns. Arrows connect each logical GroupExpression to its child Groups. Later statistics, exploration, physical expressions, enforcers, costs, and chosen-plan state are intentionally absent.</desc>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#64748b"/>
    </marker>
    <style>
      .background { fill: #f8fafc; }
      .edge { fill: none; stroke: #64748b; stroke-width: 2.2; marker-end: url(#arrow); }
      .node { fill: #ffffff; stroke: #334155; stroke-width: 2; rx: 10; }
      .root { fill: #fefce8; stroke: #a16207; stroke-width: 3; }
      .join { fill: #eff6ff; stroke: #1d4ed8; }
      .snapshot-box { fill: #ecfdf5; stroke: #047857; stroke-width: 1.5; rx: 8; }
      .pending-box { fill: #f1f5f9; stroke: #94a3b8; stroke-width: 1.5; rx: 8; }
      .title { font: 700 17px ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; fill: #0f172a; }
      .line { font: 13px ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; fill: #334155; }
      .logical { fill: #1d4ed8; }
      .snapshot { font: 700 13px ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; fill: #047857; }
      .pending { font: 13px ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; fill: #64748b; }
      .heading { font: 700 24px system-ui, sans-serif; fill: #0f172a; }
      .subtitle { font: 14px system-ui, sans-serif; fill: #475569; }
      .branch { font: 700 13px system-ui, sans-serif; fill: #475569; letter-spacing: 0.04em; }
      .source { font: 12px system-ui, sans-serif; fill: #64748b; }
    </style>
  </defs>

  <rect class="background" x="0" y="0" width="1800" height="1540"/>
  <text x="60" y="38" class="heading">Nereids Cascades Memo — initial state after toMemo()</text>
  <text x="60" y="64" class="subtitle">15 Groups are created children-first from the rewritten LogicalPlan. Arrows point from each GroupExpression to its child Groups.</text>

  <rect class="snapshot-box" x="60" y="84" width="660" height="40"/>
  <text x="80" y="109" class="snapshot">SNAPSHOT: toMemo() returned · rewrittenPlan copied · no MV alternatives</text>
  <rect class="pending-box" x="750" y="84" width="990" height="40"/>
  <text x="770" y="109" class="pending">NOT RUN: DeriveStats → exploration → implementation → enforcers → cost → chooseBestPlan</text>

  <!-- Initial parent-to-child Group dependencies: 15 Groups and 14 edges. -->
  <path class="edge" data-from="@14" data-to="@13" d="M900 245 L900 275"/>
  <path class="edge" data-from="@13" data-to="@12" d="M900 370 L900 400"/>
  <path class="edge" data-from="@12" data-to="@11" d="M900 500 L900 535"/>
  <path class="edge" data-from="@11" data-to="@2" d="M800 650 C680 680 500 695 320 725"/>
  <path class="edge" data-from="@11" data-to="@10" d="M1000 650 C1090 680 1190 695 1285 725"/>
  <path class="edge" data-from="@2" data-to="@1" d="M320 825 L320 875"/>
  <path class="edge" data-from="@1" data-to="@0" d="M320 975 L320 1025"/>
  <path class="edge" data-from="@10" data-to="@9" d="M1285 825 L1285 875"/>
  <path class="edge" data-from="@9" data-to="@5" d="M1180 990 C1080 1015 980 1025 890 1055"/>
  <path class="edge" data-from="@9" data-to="@8" d="M1390 990 C1420 1015 1450 1025 1470 1055"/>
  <path class="edge" data-from="@5" data-to="@4" d="M890 1160 L890 1205"/>
  <path class="edge" data-from="@4" data-to="@3" d="M890 1305 L890 1350"/>
  <path class="edge" data-from="@8" data-to="@7" d="M1470 1160 L1470 1205"/>
  <path class="edge" data-from="@7" data-to="@6" d="M1470 1305 L1470 1350"/>

  <!-- ROOT @14 -->
  <rect class="node root" data-group="@14" x="650" y="155" width="500" height="90"/>
  <text x="670" y="183" class="title">ROOT @14 · result sink</text>
  <text x="670" y="208" class="line logical">L1 88  LogicalResultSink(@13)</text>
  <text x="670" y="231" class="line">output: c_custkey, o_orderkey, l_linenumber, o_orderdate</text>

  <!-- @13 -->
  <rect class="node" data-group="@13" x="650" y="275" width="500" height="95"/>
  <text x="670" y="303" class="title">@13 · ORDER BY</text>
  <text x="670" y="328" class="line logical">L1 87  LogicalSort(@12)</text>
  <text x="670" y="351" class="line">order: o_orderdate, o_orderkey, l_linenumber</text>

  <!-- @12 -->
  <rect class="node" data-group="@12" x="650" y="400" width="500" height="100"/>
  <text x="670" y="428" class="title">@12 · final projection</text>
  <text x="670" y="453" class="line logical">L1 86  LogicalProject(@11)</text>
  <text x="670" y="476" class="line">output: c_custkey, o_orderkey, l_linenumber,</text>
  <text x="670" y="494" class="line">        o_orderdate</text>

  <!-- @11 -->
  <rect class="node join" data-group="@11" x="620" y="535" width="560" height="115"/>
  <text x="640" y="563" class="title">@11 · lineitem join (orders join customer)</text>
  <text x="640" y="588" class="line logical">L1 85  LogicalJoin(@2, @10)</text>
  <text x="640" y="611" class="line">type: INNER_JOIN</text>
  <text x="640" y="634" class="line">hash condition: o_orderkey = l_orderkey</text>

  <text x="80" y="704" class="branch">LINEITEM BRANCH</text>
  <text x="1340" y="704" class="branch">ORDERS × CUSTOMER BRANCH</text>

  <!-- @2 -->
  <rect class="node" data-group="@2" x="80" y="725" width="480" height="100"/>
  <text x="100" y="753" class="title">@2 · lineitem projection</text>
  <text x="100" y="778" class="line logical">L1 76  LogicalProject(@1)</text>
  <text x="100" y="801" class="line">output: l_orderkey, l_linenumber</text>

  <!-- @10 -->
  <rect class="node" data-group="@10" x="1010" y="725" width="550" height="100"/>
  <text x="1030" y="753" class="title">@10 · projection above orders/customer join</text>
  <text x="1030" y="778" class="line logical">L1 84  LogicalProject(@9)</text>
  <text x="1030" y="801" class="line">output: c_custkey, o_orderkey, o_orderdate</text>

  <!-- @1 -->
  <rect class="node" data-group="@1" x="80" y="875" width="480" height="100"/>
  <text x="100" y="903" class="title">@1 · lineitem filter</text>
  <text x="100" y="928" class="line logical">L1 75  LogicalFilter(@0)</text>
  <text x="100" y="951" class="line">predicate: l_shipdate &gt; 1995-03-15</text>

  <!-- @9 -->
  <rect class="node join" data-group="@9" x="1010" y="875" width="550" height="115"/>
  <text x="1030" y="903" class="title">@9 · orders join customer</text>
  <text x="1030" y="928" class="line logical">L1 83  LogicalJoin(@5, @8)</text>
  <text x="1030" y="951" class="line">type: INNER_JOIN</text>
  <text x="1030" y="974" class="line">hash condition: c_custkey = o_custkey</text>

  <!-- @0 -->
  <rect class="node" data-group="@0" x="80" y="1025" width="480" height="90"/>
  <text x="100" y="1053" class="title">@0 · lineitem</text>
  <text x="100" y="1078" class="line logical">L1 74  LogicalOlapScan</text>
  <text x="100" y="1101" class="line">table: lineitem · alias: l</text>

  <text x="650" y="1034" class="branch">ORDERS</text>
  <text x="1230" y="1034" class="branch">CUSTOMER</text>

  <!-- @5 -->
  <rect class="node" data-group="@5" x="650" y="1055" width="480" height="105"/>
  <text x="670" y="1083" class="title">@5 · orders projection</text>
  <text x="670" y="1108" class="line logical">L1 79  LogicalProject(@4)</text>
  <text x="670" y="1131" class="line">output: o_orderkey, o_custkey, o_orderdate</text>

  <!-- @8 -->
  <rect class="node" data-group="@8" x="1230" y="1055" width="480" height="105"/>
  <text x="1250" y="1083" class="title">@8 · customer projection</text>
  <text x="1250" y="1108" class="line logical">L1 82  LogicalProject(@7)</text>
  <text x="1250" y="1131" class="line">output: c_custkey</text>

  <!-- @4 -->
  <rect class="node" data-group="@4" x="650" y="1205" width="480" height="100"/>
  <text x="670" y="1233" class="title">@4 · orders filter</text>
  <text x="670" y="1258" class="line logical">L1 78  LogicalFilter(@3)</text>
  <text x="670" y="1281" class="line">predicate: o_orderdate &lt; 1995-03-15</text>

  <!-- @7 -->
  <rect class="node" data-group="@7" x="1230" y="1205" width="480" height="100"/>
  <text x="1250" y="1233" class="title">@7 · customer filter</text>
  <text x="1250" y="1258" class="line logical">L1 81  LogicalFilter(@6)</text>
  <text x="1250" y="1281" class="line">predicate: c_mktsegment = 'BUILDING'</text>

  <!-- @3 -->
  <rect class="node" data-group="@3" x="650" y="1350" width="480" height="90"/>
  <text x="670" y="1378" class="title">@3 · orders</text>
  <text x="670" y="1403" class="line logical">L1 77  LogicalOlapScan</text>
  <text x="670" y="1426" class="line">table: orders · alias: o</text>

  <!-- @6 -->
  <rect class="node" data-group="@6" x="1230" y="1350" width="480" height="90"/>
  <text x="1250" y="1378" class="title">@6 · customer</text>
  <text x="1250" y="1403" class="line logical">L1 80  LogicalOlapScan</text>
  <text x="1250" y="1426" class="line">table: customer · alias: c</text>

  <!-- Legend -->
  <text x="80" y="1480" class="line logical">L1 = the only Logical GroupExpression in this initial Group</text>
  <text x="650" y="1480" class="line">arrow = parent GroupExpression references child Group</text>
  <text x="80" y="1506" class="pending">Absent at this boundary: PhysicalExpression · Enforcer · Statistics · Cost · Lowest Plan · Chosen marker · Groups @15–@19</text>
  <text x="80" y="1528" class="source">Sources: logical/result.txt · memo/cascades.txt initial expressions · Memo.init() children-first allocation</text>
</svg>
